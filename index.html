    <script>
      (function() {
        // 1. Define getter/setter for fetch on Window.prototype and window to prevent "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var currentFetch = window.fetch;
          var desc = {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            }
          };

          try {
            Object.defineProperty(Window.prototype, 'fetch', desc);
          } catch (_) {}

          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (_) {}
        } catch (_) {}

        // 2. Suppress unhandled errors originating from external chrome-extension scripts
        window.addEventListener('error', function(event) {
          var isExtension = (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.error && event.error.stack && event.error.stack.indexOf('chrome-extension://') !== -1);
          var isFetchGetter = event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1;

          if (isExtension || isFetchGetter) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (
            reason &&
            ((reason.stack && reason.stack.indexOf('chrome-extension://') !== -1) ||
             (reason.message && reason.message.indexOf('fetch') !== -1 && reason.message.indexOf('getter') !== -1))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (
            (url && url.indexOf('chrome-extension://') !== -1) ||
            (error && error.stack && error.stack.indexOf('chrome-extension://') !== -1) ||
            (typeof msg === 'string' && msg.indexOf('Cannot set property fetch') !== -1)
          ) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
